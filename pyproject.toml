[project]
name = "terrarover-killa-coders"
version = "4.2.0"
description = "TerraRover planetary terrain research platform"
requires-python = ">=3.11,<3.15"

dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "numpy>=1.24,<3",
    "scipy>=1.11,<2",
    "rasterio>=1.3,<2",
    "matplotlib>=3.8,<4",
    "python-dotenv>=1.0,<2",
    "python-multipart>=0.0.18,<1",
    "Pillow>=10,<13"
]

[tool.vercel]
entrypoint = "backend.api:app"
